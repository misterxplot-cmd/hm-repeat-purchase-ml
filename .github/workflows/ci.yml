name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.8-bookworm
        env:
          POSTGRES_USER: hmrp
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: hmrp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hmrp -d hmrp"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HMRP_PG_HOST: 127.0.0.1
      HMRP_PG_PORT: "5432"
      HMRP_PG_USER: hmrp
      HMRP_PG_PASSWORD: ci-only-password
      HMRP_PG_DB: hmrp
      HMRP_PG_TEST_DB: hmrp_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade "pip==24.3.1"
          pip install -r requirements.lock
          pip install --no-deps -e .
      - name: Unit and integration tests (synthetic fixtures, real PostgreSQL service)
        run: python -m pytest -q -p no:warnings
      - name: CLI smoke on synthetic data is covered by tests/test_e2e_smoke.py
        run: python -m hm_repeat_purchase --help
