[build-system]
requires = ["setuptools>=69,<76", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hm-repeat-purchase"
version = "0.1.0"
description = "Reproducible customer repeat-purchase prediction on H&M transaction history with PostgreSQL, temporal validation, logistic regression and CatBoost."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT (code only; data is subject to the H&M competition rules)" }
dependencies = [
    "numpy>=2.0,<2.3",
    "pandas>=2.2,<2.3",
    "scipy>=1.13,<1.16",
    "scikit-learn>=1.6,<1.7",
    "catboost>=1.2.7,<1.3",
    "matplotlib>=3.9,<3.11",
    "seaborn>=0.13,<0.14",
    "psycopg[binary]>=3.2,<3.3",
    "PyYAML>=6.0,<7",
    "pyarrow>=17,<20",
    "psutil>=6,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<0.11",
    "ipykernel>=6.29,<7",
]

[project.scripts]
hmrp = "hm_repeat_purchase.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a reachable PostgreSQL (docker compose or CI service)",
]
filterwarnings = ["ignore::DeprecationWarning:catboost.*"]
